name: Collect and Deploy Pages
on:
  push:
    branches: [main]
    paths-ignore: ['snapshots/**', 'metadata/**']
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-play-scraper==1.2.7
      - run: python -m compileall -q scripts
      - name: Collect daily observations
        if: github.event_name != 'push'
        run: python scripts/collect_daily.py
      - uses: actions/configure-pages@v5
      - run: python scripts/build_pages.py
      - run: python scripts/enrich_catalog.py
      - name: Validate and persist metadata
        run: python scripts/archive_metadata.py
      - name: Save historical snapshots
        run: |
          git config user.name 'mobile-product-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots metadata
          if ! git diff --cached --quiet; then
            git commit -m 'Archive public metadata observations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
